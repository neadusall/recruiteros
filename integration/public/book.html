<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Book a call</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#f4f5f8; --card:#ffffff; --line:#e4e7ec; --ink:#101828; --mut:#51596b; --faint:#8a93a5;
    --accent:#2e5bd7; --ok:#157347; --on-accent:#ffffff; }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14.5px/1.55 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, #fafbfc) 0%, var(--bg) 320px)}
  .wrap{max-width:620px;margin:36px auto;padding:32px 32px 36px;background:var(--card);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:0 1px 2px rgba(16,24,40,.05), 0 20px 44px -20px rgba(16,24,40,.14)}
  /* Chromeless mode for the watch-page embed: the host card already carries the
     brand and the "Book a call" heading, so hide ours and sit flush on white. */
  body.embed{background:#fff}
  body.embed .wrap{max-width:none;margin:0;padding:14px 20px 24px;background:transparent;border:0;border-radius:0;box-shadow:none}
  body.embed .head,body.embed h1{display:none}
  .head{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .head:empty{display:none}
  .head img{max-height:60px;max-width:340px;display:block}
  .head .bname{font-weight:600;font-size:18px;letter-spacing:-.2px}
  h1{font-size:21px;font-weight:650;letter-spacing:-.5px;margin:0 0 3px}
  .sub{color:var(--mut);font-size:12.5px;margin:0 0 16px}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:thin}
  .day{flex:none;appearance:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--mut);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;
    white-space:nowrap;transition:all .13s ease}
  .day:hover{border-color:#c9d0db;color:var(--ink)}
  .day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 1px 3px rgba(16,24,40,.16)}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}
  .slot{appearance:none;font:inherit;font-size:13px;font-weight:500;color:var(--ink);letter-spacing:.01em;
    background:var(--card);border:1px solid #d5dae3;border-radius:9px;padding:11px 4px;cursor:pointer;transition:all .13s ease}
  .slot:hover{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);
    background:color-mix(in srgb, var(--accent) 6%, #ffffff)}
  .panel{border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:6px}
  .panel .when{font-weight:600;font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .panel .when svg{width:15px;height:15px;fill:var(--accent);flex:none}
  label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
  input,textarea{width:100%;background:#fff;border:1px solid #cfd5df;color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit}
  textarea{resize:vertical;min-height:64px}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .acts{display:flex;gap:9px;margin-top:16px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;font:inherit;font-weight:600;font-size:14px;padding:11px 20px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink);transition:all .13s ease}
  .btn:hover{border-color:#c9d0db}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 1px 2px rgba(16,24,40,.14)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.primary:disabled{opacity:.6;cursor:default;filter:none}
  .msg{color:var(--mut);font-size:12.5px}
  .msg.err{color:#b42318}
  .done{text-align:center;padding:36px 14px}
  .done .ring{width:52px;height:52px;border-radius:50%;background:var(--ok);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
  .done .ring svg{width:26px;height:26px;fill:#fff}
  .done h2{font-size:17px;font-weight:600;margin:0 0 6px}
  .done p{color:var(--mut);font-size:13px;margin:0}
  .empty{text-align:center;color:var(--mut);padding:44px 16px;font-size:13.5px}
  /* Phones: thumb-size targets and 16px inputs so iOS doesn't zoom the form. */
  @media (max-width:660px){
    .wrap{margin:10px;padding:20px 16px 24px}
    body.embed .wrap{margin:0;padding:10px 14px 20px}
    .head img{max-height:48px}
    .sub{font-size:13px}
    .days{gap:7px}
    .day{padding:10px 16px;font-size:13px}
    .slots{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
    .slot{padding:14px 4px;font-size:14px}
    .panel{padding:16px 14px}
    input,textarea{font-size:16px;padding:12px}
    label{font-size:12.5px}
    .acts{flex-wrap:wrap}
    .acts .btn{padding:14px 18px;font-size:15px}
    .acts .btn.primary{flex:1 1 auto;text-align:center}
    .msg{flex-basis:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"></div>
  <div id="view"><div class="empty" id="loading">Loading open times&hellip;</div></div>
</div>

<script src="assets/js/config.js?v=ad110cbee0"></script>
<script>
(function () {
  "use strict";
  var API = (window.RECRUITEROS_API_BASE || "").replace(/\/$/, "");
  var qs = new URLSearchParams(location.search);
  var w = qs.get("w") || "", sig = qs.get("sig") || "";
  var embedded = qs.get("embed") === "1";
  if (embedded) document.body.classList.add("embed");
  var view = document.getElementById("view");
  var DATA = null, dayIdx = 0, picked = null;

  // Embed mode: report content height so the watch page can size the calendar
  // card to fit, with no dead space under the slots.
  function postH() {
    if (!embedded || !window.parent || window.parent === window) return;
    // Measure the content wrapper, not the document: documentElement.scrollHeight
    // never reports smaller than the iframe viewport, so the card could grow but
    // never shrink back to fit.
    try {
      var el = document.querySelector(".wrap");
      var h = el ? Math.ceil(el.getBoundingClientRect().height) : document.documentElement.scrollHeight;
      window.parent.postMessage({ rosBookH: h }, "*");
    } catch (e) {}
  }
  window.addEventListener("load", function () { setTimeout(postH, 60); });
  window.addEventListener("resize", function () { setTimeout(postH, 60); });
  if (embedded && window.MutationObserver) new MutationObserver(function () { setTimeout(postH, 40); }).observe(view, { childList: true, subtree: true });

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" })[c]; }); }
  function $(id) { return document.getElementById(id); }

  function applyBrand(b) {
    b = b || {};
    if (/^#[0-9a-f]{6}$/i.test(b.accent || "")) document.documentElement.style.setProperty("--accent", b.accent);
    var head = document.getElementById("head");
    var logoOk = /^https?:\/\//i.test(b.logoUrl || "") || (b.logoUrl || "").charAt(0) === "/";
    if (logoOk) head.innerHTML = '<img src="' + esc(b.logoUrl) + '" alt="" />';
    else if (b.brandName) head.innerHTML = '<span class="bname">' + esc(b.brandName) + "</span>";
    document.title = "Book a call" + (b.brandName ? " with " + b.brandName : "");
  }

  function renderPicker() {
    var days = DATA.days;
    if (!days.length) { view.innerHTML = '<div class="empty">No open times right now. Please check back soon or reply to the email you received.</div>'; return; }
    if (dayIdx >= days.length) dayIdx = 0;
    var chips = days.map(function (d, i) {
      return '<button type="button" class="day' + (i === dayIdx ? " on" : "") + '" data-i="' + i + '">' + esc(d.label) + "</button>";
    }).join("");
    var slots = days[dayIdx].slots.map(function (s) {
      return '<button type="button" class="slot" data-iso="' + esc(s.iso) + '">' + esc(s.label) + "</button>";
    }).join("");
    view.innerHTML =
      "<h1>Book a call</h1>" +
      '<p class="sub">Pick a time that works for you. All times are ' + esc(DATA.tzLabel) + " Time, " + DATA.slotMin + " minutes.</p>" +
      '<div class="days">' + chips + "</div>" +
      '<div class="slots">' + slots + "</div>";
    Array.prototype.forEach.call(view.querySelectorAll(".day"), function (el) {
      el.addEventListener("click", function () { dayIdx = +el.getAttribute("data-i"); renderPicker(); });
    });
    Array.prototype.forEach.call(view.querySelectorAll(".slot"), function (el) {
      el.addEventListener("click", function () {
        picked = { iso: el.getAttribute("data-iso"), label: el.textContent, day: days[dayIdx].label };
        renderForm();
      });
    });
  }

  function renderForm() {
    view.innerHTML =
      "<h1>Book a call</h1>" +
      '<div class="panel">' +
        '<p class="when"><svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 6v11H5V8h14z"/></svg>' +
          esc(picked.day) + " at " + esc(picked.label) + " " + esc(DATA.tzLabel) + " Time</p>" +
        "<label>Your name</label><input id=\"fName\" type=\"text\" autocomplete=\"name\" />" +
        "<label>Your email</label><input id=\"fEmail\" type=\"email\" autocomplete=\"email\" />" +
        "<label>Cell phone (optional)</label><input id=\"fPhone\" type=\"tel\" autocomplete=\"tel\" placeholder=\"(555) 555-0123\" />" +
        "<div style=\"font-size:12px;color:#8a93a5;margin-top:4px\">We'll text you a confirmation and a reminder before the call so it's one tap to join. Reply STOP anytime to opt out.</div>" +
        "<label>Anything we should know? (optional)</label><textarea id=\"fNote\"></textarea>" +
        '<div class="acts">' +
          '<button type="button" class="btn primary" id="fGo">Confirm booking</button>' +
          '<button type="button" class="btn" id="fBack">Back</button>' +
          '<span class="msg" id="fMsg"></span>' +
        "</div>" +
      "</div>";
    $("fBack").addEventListener("click", function () { picked = null; renderPicker(); });
    $("fGo").addEventListener("click", submit);
    $("fName").focus();
  }

  function submit() {
    var name = $("fName").value.trim(), email = $("fEmail").value.trim();
    var msg = $("fMsg");
    msg.className = "msg err";
    if (!name) { msg.textContent = "Please add your name."; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = "Please add a valid email."; return; }
    msg.className = "msg"; msg.textContent = "Booking…";
    var go = $("fGo"); go.disabled = true;
    fetch(API + "/api/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ w: w, sig: sig, start: picked.iso, name: name, email: email, note: $("fNote").value.trim(), phone: $("fPhone").value.trim() }),
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j && res.j.ok) { renderDone(res.j.when, res.j.meetingUrl); return; }
        go.disabled = false;
        msg.className = "msg err";
        if (res.j && res.j.error === "slot_taken") {
          msg.textContent = "That time was just taken. Pick another and you're set.";
          picked = null; load();
        } else {
          msg.textContent = "Could not book that time. Please try again.";
        }
      })
      .catch(function () { go.disabled = false; msg.className = "msg err"; msg.textContent = "Could not book that time. Please try again."; });
  }

  function renderDone(when, meetingUrl) {
    var joinOk = /^https:\/\//i.test(meetingUrl || "");
    view.innerHTML =
      '<div class="done">' +
        '<span class="ring"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>' +
        "<h2>You're booked</h2>" +
        "<p>" + esc(when || "") + ". A calendar invite is on its way to your inbox with the video call link inside.</p>" +
        (joinOk ? '<p style="margin-top:10px"><a class="btn primary" style="text-decoration:none;display:inline-block" href="' + esc(meetingUrl) + '" target="_blank" rel="noopener">Video call link</a></p>' : "") +
      "</div>";
  }

  function load() {
    fetch(API + "/api/book?w=" + encodeURIComponent(w) + "&sig=" + encodeURIComponent(sig))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || d.error) { view.innerHTML = '<div class="empty">This booking page isn\'t available right now.</div>'; return; }
        DATA = d;
        applyBrand(d.brand);
        if (picked) renderForm(); else renderPicker();
      })
      .catch(function () { view.innerHTML = '<div class="empty">This booking page isn\'t available right now.</div>'; });
  }
  if (!w || !sig) { view.innerHTML = '<div class="empty">This booking link looks incomplete.</div>'; return; }
  load();
})();
</script>
</body>
</html>
