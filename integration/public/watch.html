<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>A quick message for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#f4f5f8; --card:#ffffff; --line:#e4e7ec; --ink:#101828; --mut:#51596b; --faint:#8a93a5;
    --brand:#2e5bd7; --accent:#2e5bd7; --book:#157347; --on-accent:#ffffff;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 20px 44px -20px rgba(16,24,40,.16); }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
    font:15px/1.55 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
  /* Brand-tinted wash behind the content; the plain --bg above is the fallback. */
  body{background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, #fafbfc) 0%, var(--bg) 340px)}
  .top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 44px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .top::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:10;background:var(--accent);
    background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #ffffff))}
  .brand{font-weight:600;letter-spacing:-.3px;font-size:19px;color:var(--ink)}
  .priv{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--faint);border:1px solid var(--line);background:rgba(255,255,255,.7);
    border-radius:999px;padding:7px 13px;white-space:nowrap}
  .priv svg{width:12px;height:12px;fill:var(--faint);flex:none}
  main{flex:1;display:flex;justify-content:center;padding:38px 44px 30px}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .ctx{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
  .player{animation:rise .55s .08s cubic-bezier(.2,.7,.3,1) both}
  .cta{animation:rise .55s .16s cubic-bezier(.2,.7,.3,1) both}
  .side{animation:rise .55s .24s cubic-bezier(.2,.7,.3,1) both}
  @media (prefers-reduced-motion:reduce){ .ctx,.player,.cta,.side{animation:none} }
  .stage{width:100%;max-width:1160px}
  .cols{display:block}
  .cols:not(.has-cal) .maincol{max-width:860px;margin:0 auto}
  .cols.has-cal{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:34px;align-items:start}
  .maincol{min-width:0;display:flex;flex-direction:column}
  .ctx{margin:0 0 22px}
  .eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
  .eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--accent);flex:none}
  .ctx h1{font-size:29px;margin:0;font-weight:650;letter-spacing:-.6px;line-height:1.2}
  .player{flex:none;aspect-ratio:1000/620;position:relative;border-radius:16px;overflow:hidden;
    background:#0b1220;border:1px solid rgba(16,24,40,.1);
    box-shadow:0 1px 2px rgba(16,24,40,.06), 0 24px 56px -22px rgba(16,24,40,.28);
    box-shadow:0 1px 2px rgba(16,24,40,.06), 0 24px 56px -22px rgba(16,24,40,.28),
      0 0 0 6px color-mix(in srgb, var(--accent) 6%, transparent);
    display:flex;align-items:center;justify-content:center}
  video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#0b1220}
  .player .label{position:absolute;bottom:12px;left:14px;z-index:1;color:#e6eaf1;font-size:11.5px;font-weight:500;
    background:rgba(2,8,20,.55);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:5px 12px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player .dur{position:absolute;top:14px;right:16px;background:rgba(2,8,20,.62);border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:600;
    letter-spacing:.02em;padding:4px 10px;border-radius:99px;z-index:1}
  /* "Tap for sound": only shown when the browser refused audio, so it is an answer to a real
     problem rather than decoration. Sits clear of the native controls at the bottom. */
  .player .sound{position:absolute;top:14px;left:14px;z-index:3;display:flex;align-items:center;gap:7px;
    background:rgba(2,8,20,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.28);color:#fff;font:inherit;font-size:12.5px;font-weight:600;
    padding:8px 13px;border-radius:99px;cursor:pointer;box-shadow:0 6px 20px rgba(2,8,20,.4);
    animation:pulseSound 2.2s ease-in-out infinite}
  .player .sound[hidden]{display:none}
  .player .sound:hover{background:rgba(2,8,20,.92);border-color:rgba(255,255,255,.5)}
  .player .sound svg{width:15px;height:15px;fill:#fff;flex:none}
  @keyframes pulseSound{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @media (prefers-reduced-motion:reduce){ .player .sound{animation:none} }
  /* Captions sit at the bottom of the picture, readable over any frame. */
  video::cue{background:rgba(2,8,20,.72);color:#fff;font-size:.92em;line-height:1.35}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
  .play .ring{position:absolute;width:82px;height:82px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);
    animation:pulse 2.6s cubic-bezier(.25,.6,.35,1) infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(1.55);opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .play .ring{animation:none;opacity:0} }
  .play .btn{width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.97);
    box-shadow:0 8px 28px rgba(2,8,20,.4), inset 0 -1px 0 rgba(16,24,40,.08);
    display:flex;align-items:center;justify-content:center;
    transition:transform .18s ease,box-shadow .18s ease}
  .play:hover .btn{transform:scale(1.06);box-shadow:0 10px 34px rgba(2,8,20,.48)}
  .play svg{width:30px;height:30px;margin-left:5px;fill:var(--accent)}
  .cta{flex:none;display:flex;gap:12px;margin-top:22px;align-items:center;flex-wrap:wrap}
  .cta a,.cta button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    text-decoration:none;padding:13px 26px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;
    letter-spacing:.005em;cursor:pointer;transition:all .16s ease;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .cta a:hover{border-color:#c9d0db;box-shadow:0 3px 8px rgba(16,24,40,.09);transform:translateY(-1px)}
  .cta a.primary{color:var(--on-accent);border-color:transparent;background:var(--book);
    background:linear-gradient(180deg, color-mix(in srgb, var(--book) 88%, #ffffff), var(--book));
    box-shadow:0 1px 2px rgba(16,24,40,.18), inset 0 1px 0 rgba(255,255,255,.18)}
  .cta a.primary:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 5px 14px -3px rgba(16,24,40,.3);
    box-shadow:0 5px 14px -3px color-mix(in srgb, var(--book) 55%, transparent)}
  .cta .hint{color:var(--faint);font-size:12.5px;margin-left:2px;border:0;background:none;box-shadow:none;padding:0}
  .side{display:flex;flex-direction:column;min-height:0}
  .sidecard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;transition:outline .15s}
  .sidecard.flash{outline:3px solid var(--book);outline-offset:3px}
  .side-h{flex:none;display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
  .side-h .icobox{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;
    background:#eef1f6;background:color-mix(in srgb, var(--accent) 10%, #ffffff)}
  .side-h .ico{width:16px;height:16px;fill:var(--accent)}
  .side-h .tt{min-width:0}
  .side-h .tt b{display:block;font-size:14px;font-weight:600;letter-spacing:-.1px;color:var(--ink);line-height:1.3}
  .side-h .tt span{display:block;font-size:11.5px;color:var(--faint);line-height:1.35;margin-top:1px}
  .cal{flex:none;height:556px;min-height:440px;background:#fff}
  .cal iframe{width:100%;height:100%;border:0;display:block}
  .side-f{flex:none;margin-top:10px;font-size:12px;text-align:center}
  .side-f a{color:var(--faint);text-decoration:none}
  .side-f a:hover{color:var(--ink);text-decoration:underline}
  /* Reply modal */
  .mov{position:fixed;inset:0;background:rgba(16,24,40,.52);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .mov.open{display:flex}
  .modal{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;
    box-shadow:0 24px 56px -12px rgba(16,24,40,.28)}
  .modal h3{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.3px}
  .modal .msub{margin:0 0 16px;color:var(--mut);font-size:13px}
  .modal textarea{width:100%;background:#fff;border:1px solid #cfd5df;color:var(--ink);border-radius:8px;padding:12px;font:inherit;resize:vertical;min-height:104px}
  .modal input{width:100%;margin-top:10px;background:#fff;border:1px solid #cfd5df;color:var(--ink);border-radius:8px;padding:12px;font:inherit}
  .modal textarea:focus,.modal input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .macts{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
  .macts button{appearance:none;font:inherit;font-weight:600;font-size:14px;padding:11px 20px;border-radius:9px;cursor:pointer;border:1px solid var(--line);transition:all .14s ease}
  .macts .ghost{background:transparent;color:var(--ink)}
  .macts .ghost:hover{border-color:#c9d0db}
  .macts .send{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .macts .send:hover{filter:brightness(1.07)}
  .mok{text-align:center;padding:30px 12px;color:var(--book);font-weight:500;font-size:16px}
  .err{text-align:center;color:var(--mut);padding:60px 20px}
  .pagefoot{flex:none;text-align:center;padding:26px 20px 30px;font-size:12px;color:var(--faint)}
  .pagefoot .rule{width:34px;height:1px;background:var(--line);margin:0 auto 12px}
  @media (max-width:980px){
    .cols.has-cal{display:block}
    .side{margin-top:30px}
    .top{padding:14px 20px}
    main{padding:24px 20px 44px}
    .cal{height:540px}
  }
  /* Phones: edge-to-edge rhythm, thumb-size targets, no iOS focus zoom. */
  @media (max-width:640px){
    .top{padding:12px 16px}
    .priv{display:none}
    main{padding:16px 14px 28px}
    .pagefoot{padding:18px 20px 26px}
    .ctx{margin:0 0 13px}
    .eyebrow{font-size:10px;letter-spacing:.12em;margin-bottom:6px}
    .ctx h1{font-size:21px;letter-spacing:-.4px}
    .player{border-radius:12px}
    .play .ring{width:68px;height:68px}
    .play .btn{width:68px;height:68px}
    .play svg{width:26px;height:26px}
    .player .label{bottom:10px;left:12px;font-size:11px}
    .player .dur{top:10px;right:12px}
    .cta{gap:9px;margin-top:16px}
    .cta a{flex:1 1 0;min-width:120px;text-align:center;padding:14px 10px;font-size:15px}
    .cta .hint{flex-basis:100%;margin:3px 0 0;text-align:center}
    .side{margin-top:24px}
    .side-h{padding:13px 16px}
    .side-f{margin-top:12px;font-size:13px}
    .side-f a{display:inline-block;padding:8px 10px}
    .cal{height:468px;min-height:380px}
    .mov{padding:12px;align-items:flex-end}
    .modal{max-width:none;padding:22px 18px calc(18px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
    .modal textarea,.modal input{font-size:16px}
    .macts button{flex:1 1 0;padding:14px 10px;font-size:15px}
  }
</style>
</head>
<body>
<div class="top"><span class="brand">RecruitersOS</span><span class="priv"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>Private message</span></div>
<main>
  <div class="stage" id="stage"><div class="err" id="loading">Loading&hellip;</div></div>
</main>
<div class="pagefoot" id="pagefoot" style="display:none"><div class="rule"></div><span id="footText"></span></div>

<div class="mov" id="replyModal">
  <div class="modal" id="replyCard">
    <h3 id="replyTitle">Reply</h3>
    <p class="msub">Send a quick message, it goes straight to their inbox.</p>
    <textarea id="rMsg" placeholder="Type your reply&hellip;"></textarea>
    <input id="rEmail" type="email" placeholder="Your email (so they can reply back)" />
    <div class="macts">
      <button class="ghost" id="rCancel" type="button">Cancel</button>
      <button class="send" id="rSend" type="button">Send reply</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js?v=ad110cbee0"></script>
<script>
(function(){
  var API = (window.RECRUITEROS_API_BASE || "").replace(/\/$/,"");
  var qs = new URLSearchParams(location.search);
  var key = qs.get("k") || qs.get("key") || "";
  var company = qs.get("c") || "";
  var role = qs.get("r") || "";
  var name = (qs.get("n") || "").trim();      // recipient first name
  var replyTo = qs.get("e") || "";
  var calLink = qs.get("cal") || "";          // booking URL (TidyCal/Calendly/Cal.com)
  var rcpt = qs.get("rcpt") || "";
  var prospectEmail = qs.get("pe") || "";     // the address the email was sent to, prefilled so the prospect needn't type it
  var logo = qs.get("logo") || "";
  var accent = qs.get("ac") || "";
  var brandName = (qs.get("bn") || "").trim();
  var ctaText = (qs.get("cta") || "").trim();
  var ctaUrl = qs.get("ctaurl") || "";
  var s = qs.get("s") || "";                 // short-code path: vid.<domain>/v/<code>
  var stage = document.getElementById("stage");
  var RESOLVED = null;
  var brandLabel = "RecruitersOS", trackKey = "";
  var isHttp = function (u) { return /^https?:\/\//i.test(u || ""); };
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]; }); }
  function $(id){ return document.getElementById(id); }

  function applyBrand(d){
    company = d.company || company; role = d.role || role;
    var br = d.brand || {};
    logo = br.logoLightUrl || br.logoUrl || logo; accent = br.accent || accent; brandName = (br.brandName || brandName || "").trim();
    ctaText = (br.ctaText || ctaText || "").trim(); ctaUrl = br.ctaUrl || ctaUrl;
    calLink = br.calendarUrl || calLink; replyTo = br.replyEmail || replyTo;
  }

  if (s && !key) {
    fetch(API + "/api/in-market/resolve?s=" + encodeURIComponent(s))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || d.error || !d.key) { stage.innerHTML = '<div class="err">This link looks incomplete or expired.</div>'; return; }
        RESOLVED = d;
        applyBrand(d);
        go();
      })
      .catch(function(){ stage.innerHTML = '<div class="err">This video isn\'t available right now.</div>'; });
    return;
  }

  // Raw-key links: resolve the owning workspace's brand kit (logo, accent, CTA, booking
  // calendar) so every link in the wild renders the fully branded landing page. Best-effort:
  // the page still renders on any failure, just with the URL-provided styling.
  var kExp = qs.get("exp"), kSig = qs.get("sig");
  if (key && kExp && kSig) {
    fetch(API + "/api/in-market/resolve?k=" + encodeURIComponent(key) + "&exp=" + encodeURIComponent(kExp) + "&sig=" + encodeURIComponent(kSig))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if (d && !d.error) applyBrand(d); })
      .catch(function(){})
      .then(go, go);
    return;
  }
  go();

  function go(){
  if (/\{\{|\}\}/.test(name)) name = "";
  if (/\{\{|\}\}/.test(brandName)) brandName = "";
  if (/^#[0-9a-f]{6}$/i.test(accent)) { document.documentElement.style.setProperty("--accent", accent); document.documentElement.style.setProperty("--book", accent); }
  // Host decides the fallback brand (tenant isolation): a customer domain never
  // wears the house label, and this light page gets the navy wordmark.
  var isHouse = /(^|\.)recruitersos\.co$|localhost|127\.0\.0\.1|^$/.test(location.hostname || "");
  if (!isHouse && !isHttp(logo) && logo.charAt(0) !== "/") { logo = "/assets/img/lume-wordmark-navy.svg"; if (!brandName) brandName = "Lume Search Partners"; }
  brandLabel = brandName || "RecruitersOS";
  var topEl = document.querySelector(".top .brand");
  var logoOk = isHttp(logo) || logo.charAt(0) === "/";   // same-origin asset paths are fine
  if (topEl) { if (logoOk) topEl.outerHTML = '<img src="' + logo.replace(/"/g, "%22") + '" alt="" style="max-height:88px;max-width:min(460px,82vw);display:block;object-fit:contain" />'; else topEl.textContent = brandLabel.replace(/[<>&]/g, ""); }
  var rt = $("replyTitle"); if (rt) rt.textContent = "Reply to " + brandLabel.replace(/[<>&]/g, "");
  document.title = company ? ("A quick note about " + company) : ("A message from " + brandLabel);

  // Asset URLs: resolved short code (already signed) or built from the key + signed query.
  // cb= busts caches hourly: composites can be re-rendered IN PLACE under the same key (the
  // rebuild sweep overwrites old links), so a viewer who watched an earlier render must not be
  // pinned to their browser's stale copy.
  var bust = "&cb=" + Math.floor(Date.now() / 3600000);
  var mp4, gif;
  if (RESOLVED) {
    trackKey = RESOLVED.key; mp4 = RESOLVED.mp4 + (RESOLVED.mp4.indexOf("?") >= 0 ? "" : "?") + bust;
    gif = RESOLVED.gif + (RESOLVED.gif.indexOf("?") >= 0 ? "&" : "?") + "notrack=1" + bust;
  } else {
    if (!key || !/^[a-z0-9_-]{3,120}$/.test(key)) { stage.innerHTML = '<div class="err">This link looks incomplete or expired.</div>'; return; }
    var auth = "";
    var exp = qs.get("exp"), sig = qs.get("sig");
    if (exp && sig) auth = "&exp=" + encodeURIComponent(exp) + "&sig=" + encodeURIComponent(sig);
    trackKey = key;
    mp4 = API + "/api/in-market/watch?key=" + encodeURIComponent(key) + "&fmt=mp4" + auth + bust;
    gif = API + "/api/in-market/watch?key=" + encodeURIComponent(key) + "&fmt=gif&notrack=1" + auth + bust;
  }

  // Captions: the spoken words, transcribed ONCE per recording and reused by every video built
  // on that take. 204 when there is no transcript yet, in which case the track stays empty and
  // the video simply plays without captions.
  var vttUrl = "";
  (function () {
    var exp2 = qs.get("exp"), sig2 = qs.get("sig");
    if (!trackKey || !exp2 || !sig2) return;
    vttUrl = API + "/api/in-market/captions?key=" + encodeURIComponent(trackKey) +
      "&exp=" + encodeURIComponent(exp2) + "&sig=" + encodeURIComponent(sig2);
  })();

  /* engagement tracking (anonymous session) */
  var sid;
  try { sid = sessionStorage.getItem("ros_sid"); if (!sid) { sid = (Math.random().toString(36).slice(2) + Date.now().toString(36)); sessionStorage.setItem("ros_sid", sid); } } catch (e) { sid = "anon"; }
  function track(t, secs) {
    try {
      var payload = JSON.stringify({ k: trackKey, t: t, c: company, r: role, sid: sid, s: secs, rcpt: rcpt });
      var url = API + "/api/in-market/track";
      if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([payload], { type: "text/plain" }));
      else fetch(url, { method: "POST", body: payload, keepalive: true });
    } catch (e) {}
  }

  var title = name ? esc(name) + ", a quick note about " + esc(company || "your team") : "A quick note about " + esc(company || "your team");
  var eyebrow = (name ? "Prepared for " + name : "A personal message") + (company ? " · " + company : "");
  var hasCal = isHttp(calLink);
  var bookUrl = isHttp(ctaUrl) ? ctaUrl : (isHttp(calLink) ? calLink : "");
  var bookLabel = ctaText || "Book a call";

  var cta = "";
  if (hasCal) cta += '<a class="primary" id="bookBtn" href="#">' + esc(bookLabel) + '</a>';
  else if (bookUrl) cta += '<a class="primary" href="' + esc(bookUrl) + '" target="_blank" rel="noopener">' + esc(bookLabel) + '</a>';
  cta += '<a id="replyBtn" href="#">Reply</a>';
  if (hasCal) cta += '<span class="hint">or pick a time on the calendar</span>';

  var leftCol =
    '<div class="ctx"><span class="eyebrow">' + esc(eyebrow) + '</span><h1>' + title + '</h1></div>' +
    '<div class="player" id="player">' +
      '<span class="dur" id="dur" style="display:none"></span>' +
      '<video id="vid" playsinline preload="metadata" crossorigin="anonymous" poster="' + gif + '"></video>' +
      '<button class="sound" id="soundBtn" type="button" hidden>' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c3 .9 5 3.5 5 6.7s-2 5.8-5 6.7v2.1c4.1-.9 7-4.5 7-8.8s-2.9-7.9-7-8.8z"/></svg>' +
        "<span>Tap for sound</span></button>" +
      '<div class="play" id="overlay"><span class="ring"></span><div class="btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>' +
      (role ? '<span class="label">' + esc(role) + '</span>' : '') +
    '</div>' +
    '<div class="cta">' + cta + '</div>';
  // The in-page calendar embeds the booking page in chromeless mode (embed=1: no
  // duplicate logo/heading inside the card); the new-tab link keeps the full page.
  var calSrc = calLink + (calLink.indexOf("?") >= 0 ? "&" : "?") + "embed=1";
  var rightCol = hasCal
    ? '<aside class="side"><div class="sidecard" id="cal">' +
        '<div class="side-h"><span class="icobox"><svg class="ico" viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 6v11H5V8h14z"/></svg></span><span class="tt"><b>Book a call</b><span>Pick a time, the invite arrives instantly</span></span></div>' +
        '<div class="cal"><iframe src="' + esc(calSrc) + '" title="Book a time" loading="eager"></iframe></div></div>' +
        '<div class="side-f"><a href="' + esc(calLink) + '" target="_blank" rel="noopener">Open the calendar in a new tab</a></div></aside>'
    : '';
  if (hasCal) stage.className = "stage wide";
  stage.innerHTML = '<div class="cols' + (hasCal ? ' has-cal' : '') + '"><div class="maincol">' + leftCol + '</div>' + rightCol + '</div>';

  // Letterhead-style closing line, only once the page has real content.
  var pf = $("pagefoot"), pft = $("footText");
  if (pf && pft) { pft.textContent = "A personal video message from " + brandLabel.replace(/[<>&]/g, ""); pf.style.display = "block"; }

  // Built-in booking pages report their content height (rosBookH) so the card
  // hugs the slot grid instead of showing dead space. Third-party calendars
  // never send it and keep the fixed CSS height. Value is clamped, so an
  // arbitrary sender can at worst resize the card.
  window.addEventListener("message", function(e){
    var h = e && e.data && e.data.rosBookH;
    var box = document.querySelector(".cal");
    if (box && typeof h === "number" && isFinite(h)) box.style.height = Math.max(340, Math.min(700, Math.ceil(h) + 2)) + "px";
  });

  // Book a call: scroll to + highlight the embedded calendar.
  var book = $("bookBtn");
  if (book) book.addEventListener("click", function(e){
    e.preventDefault();
    var side = document.querySelector(".side"), cal = $("cal");
    if (side) side.scrollIntoView({ behavior:"smooth", block:"center" });
    if (cal){ cal.classList.add("flash"); setTimeout(function(){ cal.classList.remove("flash"); }, 1300); }
  });

  // Reply: pop-up that posts to the lead endpoint (emails the sender).
  var modal = $("replyModal");
  function openM(){ modal.classList.add("open"); var t=$("rMsg"); if(t) t.focus(); }
  function closeM(){ modal.classList.remove("open"); }
  // Prefill the reply-from address with the email the message was sent to, and hide the field -
  // the prospect just types a message and hits send.
  if (prospectEmail && $("rEmail")) { $("rEmail").value = prospectEmail; $("rEmail").style.display = "none"; }
  var reply = $("replyBtn"); if (reply) reply.addEventListener("click", function(e){ e.preventDefault(); openM(); });
  var cancel = $("rCancel"); if (cancel) cancel.addEventListener("click", closeM);
  if (modal) modal.addEventListener("click", function(e){ if (e.target === modal) closeM(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeM(); });
  var sendBtn = $("rSend");
  if (sendBtn) sendBtn.addEventListener("click", function(){
    var msg = ($("rMsg").value || "").trim(), em = ($("rEmail").value || "").trim();
    if (!msg && !em) { $("rMsg").focus(); return; }
    try {
      var payload = JSON.stringify({ k: trackKey, type: "reply", message: msg, email: em, name: name, c: company, r: role, rcpt: rcpt });
      if (navigator.sendBeacon) navigator.sendBeacon(API + "/api/in-market/lead", new Blob([payload], { type: "text/plain" }));
      else fetch(API + "/api/in-market/lead", { method: "POST", body: payload, keepalive: true });
    } catch (e2) {}
    $("replyCard").innerHTML = '<div class="mok">✓ Sent' + (name ? ", " + esc(name) : "") + ", thanks! They'll get back to you shortly.</div>";
    setTimeout(closeM, 1900);
  });

  /* video */
  var vid = $("vid"), overlay = $("overlay");
  vid.src = mp4;
  vid.addEventListener("loadedmetadata", function(){
    var d = vid.duration; if (d && isFinite(d)) { var m = Math.floor(d/60), sec = Math.round(d%60); var el = $("dur"); if (el){ el.textContent = m + ":" + (sec<10?"0":"") + sec; el.style.display = "block"; } }
  });
  vid.addEventListener("error", function(){ $("player").innerHTML = '<div class="err">This video isn\'t available right now.</div>'; });
  // Captions track: added only once we know a transcript exists, so a 204 never leaves an empty
  // "English" entry sitting in the player's menu.
  if (vttUrl) {
    fetch(vttUrl).then(function (r) {
      if (!r.ok || r.status === 204) return;
      return r.text().then(function (body) {
        if (!body || body.indexOf("WEBVTT") !== 0) return;
        var tr = document.createElement("track");
        tr.kind = "captions"; tr.label = "English"; tr.srclang = "en"; tr.default = true;
        tr.src = URL.createObjectURL(new Blob([body], { type: "text/vtt" }));
        vid.appendChild(tr);
        try { if (vid.textTracks && vid.textTracks[0]) vid.textTracks[0].mode = "showing"; } catch (e) {}
      });
    }).catch(function () { /* captions are a bonus, never a blocker */ });
  }

  // Sound. Most people open this at their desk in an office, so we try with audio on (the click
  // is a real user gesture, which browsers accept) and fall back to a muted play plus a clear
  // prompt if the browser blocks it anyway. Nobody ends up watching a silent video by accident.
  var soundBtn = $("soundBtn");
  function showSoundPrompt(show) { if (soundBtn) soundBtn.hidden = !show; }
  function start(){
    if (vid.ended) vid.currentTime = 0;
    vid.muted = false;
    vid.controls = true;
    overlay.style.display = "none";
    var p = vid.play();
    if (p && typeof p.catch === "function") {
      p.then(function () { showSoundPrompt(false); }).catch(function () {
        // Autoplay policy refused audio: play silently rather than not at all, and say so.
        vid.muted = true;
        showSoundPrompt(true);
        var q = vid.play();
        if (q && typeof q.catch === "function") q.catch(function () { overlay.style.display = "flex"; });
      });
    }
  }
  overlay.addEventListener("click", start);
  if (soundBtn) soundBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    vid.muted = false;
    vid.volume = 1;
    showSoundPrompt(false);
    if (vid.paused) vid.play().catch(function () {});
  });
  vid.addEventListener("volumechange", function () { if (!vid.muted) showSoundPrompt(false); });

  track("open");

  var played = false, lastBeat = 0, beatTimer = null;
  vid.addEventListener("play", function(){
    overlay.style.display = "none";
    if (!played) { played = true; track("play"); }
    lastBeat = vid.currentTime;
    if (!beatTimer) beatTimer = setInterval(function(){
      if (!vid.paused && !vid.ended) { var d = vid.currentTime - lastBeat; if (d > 0) { track("heartbeat", d); lastBeat = vid.currentTime; } }
    }, 10000);
  });
  function flushBeat(){ if (played) { var d = vid.currentTime - lastBeat; if (d > 0.5) { track("heartbeat", d); lastBeat = vid.currentTime; } } }
  vid.addEventListener("pause", flushBeat);
  vid.addEventListener("ended", function(){ flushBeat(); track("complete"); vid.controls = false; overlay.style.display = "flex"; });
  window.addEventListener("pagehide", flushBeat);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") flushBeat(); });

  } // end go()
})();
</script>
</body>
</html>
